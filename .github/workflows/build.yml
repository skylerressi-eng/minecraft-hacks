name: Build Phantom Client JAR

on:
  push:
    branches: [ 'claude/minecraft-hack-client-IPi0a', 'claude/vigilant-knuth-LGZHm', 'main' ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod JAR (Fabric Loom)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build-output.log

      - name: Report build failure (diagnostic log to issue)
        if: failure() && github.ref == 'refs/heads/claude/vigilant-knuth-LGZHm'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Automated CI diagnostic for run ${{ github.run_number }} (commit ${{ github.sha }})."
            echo
            echo "### Error / failure lines"
            echo '```'
            grep -nE "error:|: error|FAILED|BUILD FAILED|What went wrong|Caused by|Exception|cannot find symbol|incompatible types|no suitable method" build-output.log | tail -n 150 || true
            echo '```'
            echo
            echo "### Log tail"
            echo '```'
            tail -c 40000 build-output.log || true
            echo '```'
          } > issue-body.md
          gh issue create \
            --title "CI diagnostic: build run ${{ github.run_number }}" \
            --body-file issue-body.md \
            --repo "$GITHUB_REPOSITORY" || true

      - name: Collect remapped mod JAR
        run: |
          mkdir -p dist
          # The remapped, runnable mod jar has no -dev/-sources classifier.
          find build/libs -name 'phantom-client-*.jar' \
            ! -name '*-dev.jar' ! -name '*-sources.jar' \
            -exec cp {} dist/ \;
          echo "Artifacts:"
          ls -la dist/

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: phantom-client-mod
          path: dist/*.jar
          if-no-files-found: error

      - name: Create Release
        if: github.ref == 'refs/heads/claude/minecraft-hack-client-IPi0a' || github.ref == 'refs/heads/claude/vigilant-knuth-LGZHm'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v3.0.0-${{ github.run_number }}
          name: "Phantom Client v3.0.0 (Build #${{ github.run_number }})"
          body: |
            ## Phantom Client v3.0.0 — Minecraft 1.21.x

            Drop the `.jar` into your `.minecraft/mods/` folder (NOT into the Modrinth
            "add content" uploader — just the mods folder on disk).

            **Requires (all three):**
            - Minecraft **1.21.x** (the whole 1.21 line is supported)
            - **Fabric Loader** 0.16+ (install the Fabric *loader* for your MC version)
            - **Fabric API** — download the matching jar and put it in `mods/` too

            > If pressing the key does nothing, you are almost always missing
            > **Fabric API** in your `mods/` folder, or your Minecraft version is not
            > 1.21.x. Both jars (this one **and** Fabric API) must be in `mods/`.

            **Controls:**
            - **Right Shift**: open the GUI (rebindable in **Options ▸ Controls ▸ Phantom Client**)
            - In the GUI: click a module to toggle it, press 1-7 to switch game mode
            - **V** (in-game): toggle AutoBreachSwap (also rebindable)
            - **Esc** or **Right Shift**: close the GUI

            58 modules across 7 game modes, with the stealth engine running in the
            background. The open key is now a real registered key binding, so it
            shows up in the vanilla Controls menu and is delivered by Minecraft's
            own input system (no fragile raw-input polling).
          files: dist/*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
