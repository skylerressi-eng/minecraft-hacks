name: Build Phantom Client JAR

on:
  push:
    branches: [ 'claude/minecraft-hack-client-IPi0a', 'claude/vigilant-knuth-LGZHm', 'main' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod JAR (Fabric Loom)
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Collect remapped mod JAR
        run: |
          mkdir -p dist
          # The remapped, runnable mod jar has no -dev/-sources classifier.
          find build/libs -name 'phantom-client-*.jar' \
            ! -name '*-dev.jar' ! -name '*-sources.jar' \
            -exec cp {} dist/ \;
          echo "Artifacts:"
          ls -la dist/

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: phantom-client-mod
          path: dist/*.jar
          if-no-files-found: error

      - name: Create Release
        if: github.ref == 'refs/heads/claude/minecraft-hack-client-IPi0a' || github.ref == 'refs/heads/claude/vigilant-knuth-LGZHm'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v3.0.0-${{ github.run_number }}
          name: "Phantom Client v3.0.0 (Build #${{ github.run_number }})"
          body: |
            ## Phantom Client v3.0.0 — built for Minecraft 1.21.11

            Drop the `.jar` into your `.minecraft/mods/` folder (NOT into the Modrinth
            "add content" uploader — just the mods folder on disk).

            **Requires (all three):**
            - Minecraft **1.21.11** (built against it; declares `~1.21` so it will try
              to load on other 1.21.x builds, but 1.21.11 is what it's tested against)
            - **Fabric Loader** 0.16+ (install the Fabric *loader* for your MC version)
            - **Fabric API** — download the matching jar and put it in `mods/` too

            > If pressing Right Shift does nothing, you are almost always missing
            > **Fabric API** in your `mods/` folder, or your Minecraft version isn't
            > 1.21.11. Both jars (this one **and** Fabric API) must be in `mods/`.

            **Controls:**
            - **Right Shift**: open / close the GUI
            - In the GUI: **click** a module to toggle it, press **1-7** to switch game mode
            - **V** (in-game): toggle AutoBreachSwap
            - **Esc**: also closes the GUI

            58 modules across 7 game modes, with the stealth engine running in the
            background. Input is read by polling GLFW directly, so the GUI keeps
            working across Minecraft's 1.21.9+ input-API changes.
          files: dist/*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
