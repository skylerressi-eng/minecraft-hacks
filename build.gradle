plugins {
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

sourceSets {
    stubs {
        java {
            srcDir 'stubs/java'
        }
    }
    main {
        java {
            compileClasspath += sourceSets.stubs.output
        }
    }
    test {
        java {
            compileClasspath += sourceSets.stubs.output
            // Only include the standalone test runner, not JUnit tests
            exclude '**/HumanizedTimerTest.java'
            exclude '**/AntiCheatBypassTest.java'
            exclude '**/ModuleManagerTest.java'
        }
    }
}

dependencies {
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Tests are standalone (no JUnit) - run via JavaExec
test {
    enabled = false
}

task runTests(type: JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.github.hackclient.TestRunner'
}

check.dependsOn runTests

jar {
    archiveBaseName = 'phantom-client'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
            'Fabric-Loom-Mixin-Remap-Type': 'static',
            'Fabric-Mapping-Namespace': 'intermediary',
        )
    }
}
